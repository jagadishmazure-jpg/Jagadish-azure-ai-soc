[project]
name = "azure-ai-soc"
version = "0.1.0"
description = "An agentic security operations centre on Azure, offline-first: Microsoft Agent Framework agents for triage, investigation, ATT&CK mapping, threat intel, UEBA, predictive risk and human-approved containment over synthetic Sentinel / Defender XDR-shaped data for a fictional MSSP and its tenants."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
# Pinned to the versions the tests were run with. No Azure SDK is a dependency: the Foundry adapter
# imports agent-framework-foundry lazily, so the repo installs and runs with no cloud packages.
dependencies = [
  "agent-framework-core==1.19.0", # Microsoft Agent Framework: workflows, executors, agents, HITL requests
  "mcp==2.2.0",                   # Sentinel-MCP-shaped tool server
  "pydantic>=2.13,<3",            # structured model output
  "pyyaml==6.0.3",                # tenants, rules, thresholds, ATT&CK catalogue
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]
foundry = ["agent-framework-foundry==1.13.1", "azure-identity>=1.25,<2"]

[project.scripts]
aisoc = "aisoc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisoc"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
