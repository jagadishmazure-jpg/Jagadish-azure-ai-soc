title: Tool result carries a prompt-injection phrase
id: e25dc878-7bbb-50e1-bc7a-7df1d0ea73b3
status: experimental
description: Content returned to an agent by a tool (a web page, email or file) contains a phrase that tries to override the agent's instructions.
author: Jagadish Meduri
tags: [atlas.aml.t0051.001]
logsource: { product: ai_agent, category: tool_call }
detection:
  selection:
    ToolOutput|contains:
      - 'ignore previous instructions'
      - 'ignore all prior instructions'
      - 'disregard your system prompt'
      - 'you are now in developer mode'
  condition: selection
falsepositives: [Security training material and articles about prompt injection]
level: medium
