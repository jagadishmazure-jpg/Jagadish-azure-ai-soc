title: Office application starts a script interpreter
id: 5239ba82-33f2-521b-8b20-5916b4c52d44
status: experimental
description: A document opened in an Office app starts a shell or script host, a common first step after a malicious attachment.
author: Jagadish Meduri
tags: [attack.execution, attack.t1204.002, attack.t1059]
logsource: { product: windows, category: process_creation }
detection:
  selection_parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\powerpnt.exe', '\outlook.exe']
  selection_child:
    Image|endswith: ['\powershell.exe', '\cmd.exe', '\wscript.exe', '\cscript.exe', '\mshta.exe']
  condition: selection_parent and selection_child
falsepositives: [Signed macros that call a helper script]
level: high
