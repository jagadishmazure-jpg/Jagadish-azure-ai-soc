title: Volume shadow copies deleted
id: b9ae1399-e155-5489-872e-879195c0d74a
status: experimental
description: Shadow copies are deleted, which removes local restore points before ransomware encrypts files.
author: Jagadish Meduri
tags: [attack.impact, attack.t1490]
logsource: { product: windows, category: process_creation }
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all: ['delete', 'shadows']
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all: ['shadowcopy', 'delete']
  condition: 1 of selection_*
falsepositives: [Backup software that manages its own snapshots]
level: high
