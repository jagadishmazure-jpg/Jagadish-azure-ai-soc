title: Agent file tool reads a credential file
id: 04b7cc05-1c95-571f-9863-02543ec2efec
status: experimental
description: An AI agent's file tool opens a file that normally holds keys or tokens.
author: Jagadish Meduri
tags: [attack.credential-access, attack.t1552.001, atlas.aml.t0053, atlas.aml.t0055]
logsource: { product: ai_agent, category: tool_call }
detection:
  selection_tool:
    ToolName: ['read_file', 'file_read', 'open_file']
  selection_path:
    ToolArguments|contains: ['.ssh/id_', '.aws/credentials', '.azure/', '.kube/config', '/.env']
  condition: selection_tool and selection_path
falsepositives: [Agents that are meant to manage developer machines]
level: high
