title: New credential added to a service principal
id: df3c9379-dc4d-5861-96de-c47258553a91
status: experimental
description: A secret or certificate is added to an app's service principal, a quiet way to keep access to a tenant.
author: Jagadish Meduri
tags: [attack.persistence, attack.t1098.001]
logsource: { product: azure, service: auditlogs }
detection:
  selection:
    ActivityDisplayName: 'Add service principal credentials'
    Result: success
  filter_pipeline:
    InitiatedBy|endswith: '@deploy.halyard.example'
  condition: selection and not filter_pipeline
falsepositives: [Planned secret rotation done by hand]
level: medium
