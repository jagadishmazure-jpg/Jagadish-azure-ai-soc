# Positive (match) and negative (no_match) OCSF events for rules/nw-tor-ports.yml. Synthetic.
rule: nw-tor-ports
events:
- expect: match
  note: local Tor proxy port
  event:
    class_uid: 4001
    metadata:
      uid: nw-tor-p1
      product:
        name: Sysmon
    actor:
      process:
        file:
          path: C:\Users\a.rivera\AppData\Local\Temp\svc.exe
    src_endpoint:
      ip: 10.20.4.17
    dst_endpoint:
      ip: 127.0.0.1
      port: 9050
    device:
      hostname: BWL-WS-0142
- expect: match
  note: relay port
  event:
    class_uid: 4001
    metadata:
      uid: nw-tor-p2
      product:
        name: Sysmon
    actor:
      process:
        file:
          path: C:\Users\a.rivera\AppData\Local\Temp\svc.exe
    src_endpoint:
      ip: 10.20.4.17
    dst_endpoint:
      ip: 203.0.113.9
      port: 9001
    device:
      hostname: BWL-WS-0142
- expect: no_match
  note: ordinary HTTPS
  event:
    class_uid: 4001
    metadata:
      uid: nw-tor-n1
      product:
        name: Sysmon
    actor:
      process:
        file:
          path: C:\Program Files\Browser\browser.exe
    src_endpoint:
      ip: 10.20.4.17
    dst_endpoint:
      ip: 203.0.113.9
      port: 443
    device:
      hostname: BWL-WS-0142
- expect: no_match
  note: port 9000, next to the relay range
  event:
    class_uid: 4001
    metadata:
      uid: nw-tor-n2
      product:
        name: Sysmon
    actor:
      process:
        file:
          path: C:\Tools\agent.exe
    src_endpoint:
      ip: 10.20.4.17
    dst_endpoint:
      ip: 203.0.113.9
      port: 9000
    device:
      hostname: BWL-WS-0142
