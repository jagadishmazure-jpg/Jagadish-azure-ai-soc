# Positive (match) and negative (no_match) OCSF events for rules/ai-credential-file-read.yml. Synthetic.
rule: ai-credential-file-read
events:
- expect: match
  note: SSH private key
  event:
    class_uid: 6003
    metadata:
      uid: ai-cred-p1
      product:
        name: Agent Gateway
    api:
      operation: read_file
      request:
        data: '{"path":"/home/dev/.ssh/id_ed25519"}'
      response:
        data: ''
    actor:
      app_name: triage-agent
      session:
        uid: sess-ai-cred-p1
- expect: match
  note: cloud CLI credentials
  event:
    class_uid: 6003
    metadata:
      uid: ai-cred-p2
      product:
        name: Agent Gateway
    api:
      operation: file_read
      request:
        data: '{"path":"/home/dev/.aws/credentials"}'
      response:
        data: ''
    actor:
      app_name: triage-agent
      session:
        uid: sess-ai-cred-p2
- expect: no_match
  note: ordinary source file
  event:
    class_uid: 6003
    metadata:
      uid: ai-cred-n1
      product:
        name: Agent Gateway
    api:
      operation: read_file
      request:
        data: '{"path":"/srv/app/main.py"}'
      response:
        data: ''
    actor:
      app_name: triage-agent
      session:
        uid: sess-ai-cred-n1
- expect: no_match
  note: public key listed by a search tool
  event:
    class_uid: 6003
    metadata:
      uid: ai-cred-n2
      product:
        name: Agent Gateway
    api:
      operation: search_files
      request:
        data: '{"path":"/home/dev/.ssh/id_ed25519.pub"}'
      response:
        data: ''
    actor:
      app_name: triage-agent
      session:
        uid: sess-ai-cred-n2
