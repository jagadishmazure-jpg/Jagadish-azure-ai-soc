# Positive (match) and negative (no_match) OCSF events for rules/id-sp-credential-added.yml. Synthetic.
rule: id-sp-credential-added
events:
- expect: match
  note: secret added by a user
  event:
    class_uid: 3001
    metadata:
      uid: id-spc-p1
      product:
        name: Entra ID Audit
    activity_name: Add service principal credentials
    actor:
      user:
        name: k.ito@pinecrest.example
    user:
      name: payments-connector
    status: success
- expect: no_match
  note: rotation by the deployment pipeline
  event:
    class_uid: 3001
    metadata:
      uid: id-spc-n1
      product:
        name: Entra ID Audit
    activity_name: Add service principal credentials
    actor:
      user:
        name: pipeline@deploy.halyard.example
    user:
      name: payments-connector
    status: success
- expect: no_match
  note: credential removed
  event:
    class_uid: 3001
    metadata:
      uid: id-spc-n2
      product:
        name: Entra ID Audit
    activity_name: Remove service principal credentials
    actor:
      user:
        name: k.ito@pinecrest.example
    user:
      name: payments-connector
    status: success
