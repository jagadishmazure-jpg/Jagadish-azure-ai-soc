# Allow-listed KQL templates for the query_lake tool. Agent identities can only run these, filling the
# named parameters; each parameter must match its regex, so a value cannot close the string and append
# a new pipeline stage. Raw KQL is reserved for human hunting identities (see config/identities.yaml).
# {lookback} and {until} are timespans before the investigation time, e.g. 48h and 0h.
params:
  upn: '^[a-z0-9.\-]+@[a-z0-9.\-]+\.example$'
  host: '^[A-Z]{3}-[A-Z0-9\-]{2,16}$'
  ip: '^(?:\d{1,3}\.){3}\d{1,3}$'
  domain: '^[a-z0-9.\-]+\.example$'
  lookback: '^\d{1,4}h$'
  until: '^\d{1,4}h$'
templates:
  user_signins:
    description: Sign-ins for one account.
    entity: account
    kql: |
      SigninLogs
      | where UserPrincipalName =~ "{upn}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, UserPrincipalName, IPAddress, Country = Location, ResultType, AppDisplayName
      | order by TimeGenerated asc
  user_cloud_activity:
    description: Cloud app activity (downloads, uploads, mailbox rules) for one account.
    entity: account
    kql: |
      CloudAppEvents
      | where AccountUpn =~ "{upn}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, AccountUpn, ActionType, ObjectName, Destination, IsExternal, IPAddress
      | order by TimeGenerated asc
  user_email:
    description: Email delivered to one account.
    entity: account
    kql: |
      EmailEvents
      | where RecipientEmailAddress =~ "{upn}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, SenderFromAddress, RecipientEmailAddress, Subject, ThreatTypes, Url, DeliveryAction
      | order by TimeGenerated asc
  user_url_clicks:
    description: URL clicks by one account.
    entity: account
    kql: |
      UrlClickEvents
      | where AccountUpn =~ "{upn}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, AccountUpn, Url, ActionType, NetworkMessageId
      | order by TimeGenerated asc
  host_processes:
    description: Process creation on one device.
    entity: host
    kql: |
      DeviceProcessEvents
      | where DeviceName == "{host}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, DeviceName, AccountUpn, InitiatingProcessFileName, FileName, ProcessCommandLine
      | order by TimeGenerated asc
  host_network:
    description: Outbound connections from one device.
    entity: host
    kql: |
      DeviceNetworkEvents
      | where DeviceName == "{host}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, DeviceName, RemoteIP, RemotePort, RemoteUrl, InitiatingProcessFileName
      | order by TimeGenerated asc
  ip_signins:
    description: Sign-ins from one address, all accounts.
    entity: ip
    kql: |
      SigninLogs
      | where IPAddress == "{ip}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | summarize Attempts = count(), Failures = countif(ResultType != "0"), Accounts = dcount(UserPrincipalName), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), EventIds = make_set(EventId) by IPAddress
  ip_connections:
    description: Devices that connected to one address.
    entity: ip
    kql: |
      DeviceNetworkEvents
      | where RemoteIP == "{ip}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | summarize Connections = count(), FirstSeen = min(TimeGenerated), EventIds = make_set(EventId) by DeviceName, RemoteIP
  domain_clicks:
    description: Who clicked links to one domain.
    entity: domain
    kql: |
      UrlClickEvents
      | extend UrlDomain = tostring(parse_url(Url).Host)
      | where UrlDomain == "{domain}" and TimeGenerated >= ago({lookback}) and TimeGenerated <= ago({until})
      | project TimeGenerated, EventId, AccountUpn, Url
